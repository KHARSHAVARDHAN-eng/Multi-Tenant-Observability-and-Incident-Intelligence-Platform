apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-api
  labels:
    app: observability-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: observability-api
  template:
    metadata:
      labels:
        app: observability-api
        tier: backend
    spec:
      containers:
        - name: api
          image: observability-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: observability-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-worker
  labels:
    app: observability-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: observability-worker
  template:
    metadata:
      labels:
        app: observability-worker
        tier: worker
    spec:
      containers:
        - name: worker
          image: observability-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: observability-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
