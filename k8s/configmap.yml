apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  labels:
    app.kubernetes.io/name: observability-platform
    app.kubernetes.io/part-of: incident-intelligence
data:
  DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword@postgres-service:5432/observability_db"
  REDIS_URL: "redis://redis-service:6379/0"
  TELEMETRY_QUEUE_KEY: "observability:telemetry:ingest"
  LOG_LEVEL: "INFO"
  CORRELATION_WINDOW_MINUTES: "15"
